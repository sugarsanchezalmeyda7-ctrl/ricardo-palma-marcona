name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Generar catálogo de fotos
        run: php config/gallery.php > gallery.json

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Crear artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4